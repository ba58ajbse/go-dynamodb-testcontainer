name: Go Test with Testcontainers

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 リポジトリをチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🛠️ Go をセットアップ（モジュール/ビルドキャッシュ込み）
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod # go.mod の go ディレクティブに合わせる

      - name: 📦 依存関係をダウンロード
        run: go mod download

      - name: 🏃 Go テストを実行（並列）
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: go test -count=1 -v ./... # 統合テストがキャッシュでスキップされないように
